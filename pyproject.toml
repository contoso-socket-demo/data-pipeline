[project]
name = "data-pipeline"
version = "1.8.0"
description = "Contoso settlement reconciliation and reporting pipeline"
requires-python = ">=3.9,<3.10"
dependencies = [
    # WIRED into live code paths -> expected reachable
    "pyyaml==5.3.1",
    "flask==1.1.2",
    "requests==2.25.0",
    # DECLARED BUT NEVER IMPORTED -> expected unreachable.
    # This is where the CVE volume lives, which is the whole point of the
    # noise-reduction demo. pillow 8.1.0 alone carries ~40 CVEs (4 critical,
    # 26 high), cryptography 3.2 carries ~12, lxml 4.6.2 carries ~4.
    "pillow==8.1.0",
    "cryptography==3.2",
    "lxml==4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.uv]
# These pin the TRANSITIVE tree to CVE-carrying versions WITHOUT promoting
# them to direct dependencies. That distinction is the whole demo:
# Tier 2 reachability only ever resolves TRANSITIVE dependency CVEs, while a
# direct dependency always reports `direct_dependency` and stays unresolved.
#
# Without these constraints uv resolves jinja2 to 3.1.x and werkzeug to
# 3.1.x (flask 1.1.2 only sets loose lower bounds), leaving the transitive
# tree clean and the Tier 2 story with nothing to resolve.
constraint-dependencies = [
    "jinja2==2.11.2",
    "werkzeug==1.0.1",
    "itsdangerous==1.1.0",
    "urllib3==1.26.4",
]

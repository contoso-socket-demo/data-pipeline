# Items 3 and 8: both scan modes on the same tree, so the dashboard shows the
# Tier 2 vs Tier 1 contrast for Python next to the Java one.
#
# Shape of this repo, and why:
#   WIRED (expect reachable)
#     pyyaml 5.3.1   yaml.load default Loader -> CVE-2020-14343 sink, direct
#     jinja2 2.11.2  Template().render        -> TRANSITIVE via flask 1.1.2
#     urllib3 1.26.4 via requests             -> TRANSITIVE
#   DECLARED, NEVER IMPORTED (expect unreachable, this is the noise)
#     pillow 8.1.0        ~40 CVEs, 4 critical, 26 high
#     cryptography 3.2    ~12 CVEs
#     lxml 4.6.2          ~4 CVEs
#
# Python 3.9 is pinned deliberately: pillow 8.1.0 and cryptography 3.2 ship
# no wheels for 3.11+, so on a newer interpreter the --reach install fails and
# the run silently degrades to Tier 2 results.
name: socket-scans

on:
  schedule:
    - cron: '50 3,15 * * *'
  workflow_dispatch:

jobs:
  tier2:
    name: scan without --reach (Tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install -g socket
      - name: socket scan create
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: |
          socket scan create \
            --org contoso --repo data-pipeline \
            --branch main --commit-hash "$GITHUB_SHA" \
            --no-interactive .

  tier1:
    name: scan with --reach (Tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install -g socket

      - name: Remove any retained facts file
        # .socket.facts.json is RETAINED between runs; a stale one feeds the
        # previous run's reachability results into this scan.
        run: rm -f .socket.facts.json

      - name: socket scan create --reach
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: |
          socket scan create \
            --org contoso --repo data-pipeline \
            --branch main --commit-hash "$GITHUB_SHA" \
            --reach \
            --reach-continue-on-install-errors \
            --reach-continue-on-analysis-errors \
            --reach-analysis-timeout 2400 \
            --no-interactive .
